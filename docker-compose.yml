version: "3.8"

services:
  postgres:
    container_name: QuintaIpuan
    image: postgres:latest
    environment:
      POSTGRES_DB: pousada-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /data/postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - keycloak-net

  keycloak-db:
    image: postgres:11.4
    command:
      [
        "postgres",
        "-c", "listen_addresses=*",
        "-c", "log_statement=all",
        "-c", "log_destination=stderr"
      ]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "14092:5432"
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    networks:
      - keycloak-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_URL_PORT: 5432

      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak

    command: start-dev
    ports:
      - "14082:8080"
    depends_on:
      - keycloak-db
    restart: unless-stopped
    networks:
      - keycloak-net






volumes:
  postgres-data:
  keycloak-db:

networks:
  keycloak-net:
    driver: bridge
  keycloak-db: