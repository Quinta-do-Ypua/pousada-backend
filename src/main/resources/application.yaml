spring:
  application:
    name: Pousada
  config:
    import: optional:classpath:.env[.properties]
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    show-sql: on
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_SERVER}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER}
  admin-server-url: ${KEYCLOAK_ADMIN_SERVER}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

server:
  port: 8081
sendgrid:
  email: ${SENGRID_EMAIL}
  key: ${SENDGRID_KEY}
imagekit:
  chavePrivada: ${CHAVE_PRIVADA_IMAGEKIT}
  urlUpload: ${UPLOAD_URL_IMAGEKIT}
  urlDelete: ${DELETE_URL_IMAGEKIT}
stripe:
  chave_privada: ${STRIPE_PRIVATE_KEY}
  base_url_pagamento: ${URL_PAGAMENTO_STRIPE}
